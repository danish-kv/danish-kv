name: Refresh DANISH.OS profile

# Weekly (Mondays 06:00 UTC) plus a manual trigger. Weekly keeps commits
# meaningful instead of a daily churn of no-op timestamp changes.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

# Least privilege: the job only needs to write back to this repo. No secrets.
permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: pip install "PyYAML==6.0.2"

      - name: Regenerate profile
        run: python scripts/generate_profile_assets.py

      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "Nothing to update."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/live-console.svg assets/repository-galaxy.svg
          git commit -m "chore: refresh profile [skip ci]"
          git push
