<?xml version="1.0" encoding="UTF-8"?>
<!--
  Live console — a typed session replay. The lines with ids dyn-focus and
  dyn-status are rewritten from profile-data.yml by scripts/generate_profile_assets.py.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 484" width="100%" role="img" aria-labelledby="conTitle conDesc" preserveAspectRatio="xMidYMid meet">
  <title id="conTitle">DANISH.OS console — a short typed session</title>
  <desc id="conDesc">An animated terminal replay. whoami answers Muhammed Danish. role answers full-stack systems builder. current_focus answers reliable APIs, deployment systems, and product engineering. philosophy answers build systems, not isolated screens. status answers available for meaningful collaboration. A cursor blinks at the final prompt.</desc>

  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", "Cascadia Code", "Fira Code", Menlo, Consolas, monospace; }
      .fg { fill: #E6EDF3; } .muted { fill: #8B949E; } .dim { fill: #6E7681; } .accent { fill: #E9A23B; }

      /* typing: a panel-coloured cover shrinks left-to-right in character steps.
         inline style keeps covers collapsed when animations never run, so the
         session is always fully readable as a static image. */
      .cover { fill: #0D1117; transform-box: fill-box; transform-origin: 100% 50%; }
      @keyframes type { from { transform: scaleX(1); } to { transform: scaleX(0); } }
      .out { transform-box: fill-box; }
      @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }

      .c1 { animation: type .6s  steps(6)  .4s both; }  .o1 { animation: rise .35s ease-out 1.2s both; }
      .c2 { animation: type .45s steps(4)  1.9s both; } .o2 { animation: rise .35s ease-out 2.6s both; }
      .c3 { animation: type .95s steps(13) 3.3s both; } .o3 { animation: rise .35s ease-out 4.5s both; }
      .c4 { animation: type .8s  steps(10) 5.2s both; } .o4 { animation: rise .35s ease-out 6.3s both; }
      .c5 { animation: type .6s  steps(6)  7.0s both; } .o5 { animation: rise .35s ease-out 7.9s both; }
      .p6 { animation: rise .3s ease-out 8.6s both; }
      .cursor { animation: rise .3s ease-out 8.6s both, blink 1.1s step-end 9s infinite; }
      .okdot { animation: pulse 2.4s ease-in-out 8.4s infinite; }
      .live { animation: pulse 2.6s ease-in-out infinite; }

      @media (prefers-reduced-motion: reduce) {
        .cover { display: none; }
        .o1,.o2,.o3,.o4,.o5,.p6,.cursor,.okdot,.live { animation: none; }
      }
    </style>
  </defs>

  <rect x="6" y="6" width="848" height="472" rx="18" fill="#0D1117" stroke="#2A313C" stroke-width="1.5"/>

  <circle cx="40" cy="38" r="6" class="accent"/><circle cx="62" cy="38" r="6" fill="#5A6472"/><circle cx="84" cy="38" r="6" fill="#39424E"/>
  <text x="112" y="43" class="mono muted" font-size="13" letter-spacing="1">danish.os &#8212; console</text>
  <circle cx="736" cy="38" r="4" class="accent live"/>
  <text x="750" y="42" class="mono dim" font-size="12">replay &#183; 9s</text>
  <line x1="30" y1="60" x2="830" y2="60" stroke="#2A313C" stroke-width="1"/>

  <g class="mono" font-size="15">
    <text x="36" y="104" class="accent">&#10095;</text>
    <text x="58" y="104" class="fg">whoami</text>
    <rect class="cover c1" x="56" y="90" width="62" height="20" style="transform:scaleX(0)"/>
    <text x="58" y="132" class="muted out o1">Muhammed Danish</text>

    <text x="36" y="172" class="accent">&#10095;</text>
    <text x="58" y="172" class="fg">role</text>
    <rect class="cover c2" x="56" y="158" width="44" height="20" style="transform:scaleX(0)"/>
    <text x="58" y="200" class="muted out o2">Full-stack systems builder</text>

    <text x="36" y="240" class="accent">&#10095;</text>
    <text x="58" y="240" class="fg">current_focus</text>
    <rect class="cover c3" x="56" y="226" width="126" height="20" style="transform:scaleX(0)"/>
    <text x="58" y="268" class="muted out o3"><tspan id="dyn-focus">Reliable APIs, deployment systems, and product engineering</tspan></text>

    <text x="36" y="308" class="accent">&#10095;</text>
    <text x="58" y="308" class="fg">philosophy</text>
    <rect class="cover c4" x="56" y="294" width="98" height="20" style="transform:scaleX(0)"/>
    <text x="58" y="336" class="muted out o4">Build systems, not isolated screens.</text>

    <text x="36" y="376" class="accent">&#10095;</text>
    <text x="58" y="376" class="fg">status</text>
    <rect class="cover c5" x="56" y="362" width="62" height="20" style="transform:scaleX(0)"/>
    <g class="out o5">
      <text x="58" y="404" class="accent"><tspan id="dyn-status">Available for meaningful collaboration</tspan></text>
      <circle cx="470" cy="399" r="4" class="accent okdot"/>
    </g>

    <text x="36" y="444" class="accent out p6">&#10095;</text>
    <rect x="58" y="431" width="9" height="15" class="accent cursor"/>
  </g>
</svg>
