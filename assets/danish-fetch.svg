    <text x="218" y="478" class="sans" font-size="19" font-weight="800" text-anchor="middle"><tspan class="fg">DANISH</tspan><tspan class="accent">.OS</tspan></text>
    <text x="218" y="500" class="mono dim" font-size="11" text-anchor="middle">muhammed danish &#183; rendered in ascii</text>
