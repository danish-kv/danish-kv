<?xml version="1.0" encoding="UTF-8"?>
<!--
  danishfetch v2 — neofetch for DANISH.OS, with an ASCII self-portrait
  generated from the danish-kv GitHub avatar (scripts in profile history).
  The Uptime line and GitHub Stats tspans (up-time, st-repos, st-stars,
  st-commits, st-followers) are refreshed weekly by
  scripts/generate_profile_assets.py from profile-data.yml + the GitHub API.
  No scripts inside the SVG, no external fonts, reduced-motion safe.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" role="img" aria-labelledby="dfTitle dfDesc" preserveAspectRatio="xMidYMid meet">
  <title id="dfTitle">danishfetch — ASCII portrait and system readout of Muhammed Danish</title>
  <desc id="dfDesc">A terminal fetch panel. On the left, an ASCII art portrait of Muhammed Danish prints line by line. On the right, a system readout lists: OS DANISH.OS self-built; host Muhammed Danish, India; kernel full_stack; uptime always building; shell python and javascript; IDE vs code; stack frontend react, redux, tailwind, shadcn; backend django, drf, fastapi; data postgresql and mongodb; infra aws, docker, kubernetes; realtime websockets; contact LinkedIn and Medium; GitHub stats with repositories, stars, commits and followers. A theme palette bar and a blinking cursor finish the panel.</desc>

  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", "Cascadia Code", "Fira Code", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; }
      .fg { fill: #E6EDF3; } .muted { fill: #8B949E; } .dim { fill: #6E7681; } .accent { fill: #E9A23B; }

      @keyframes rise { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes pulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }

      .art { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
             font-size: 9.5px; fill: #C9D1D9; }
      .al { transform-box: fill-box; animation: rise .25s ease-out both; }
      .rl { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
             font-size: 13.5px; transform-box: fill-box; animation: rise .3s ease-out both; }
      .hd { transform-box: fill-box; animation: rise .3s ease-out both; }
      .cap { transform-box: fill-box; animation: rise .4s ease-out 1.95s both; }
      .pal { transform-box: fill-box; animation: rise .4s ease-out 1.75s both; }
      .p9 { transform-box: fill-box; animation: rise .3s ease-out 1.9s both; }
      .cursor { animation: rise .3s ease-out 1.9s both, blink 1.1s step-end 2.3s infinite; }
      .live { animation: pulse 2.6s ease-in-out infinite; }

      @media (prefers-reduced-motion: reduce) {
        .al,.rl,.hd,.cap,.pal,.p9,.cursor,.live { animation: none; }
      }
    </style>
    <pattern id="dfGrid" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#8B949E" opacity="0.08"/>
    </pattern>
  </defs>

  <rect x="6" y="6" width="1188" height="608" rx="20" fill="#0D1117" stroke="#2A313C" stroke-width="1.5"/>
  <rect x="6" y="6" width="1188" height="608" rx="20" fill="url(#dfGrid)"/>

  <!-- title bar -->
  <circle cx="44" cy="42" r="6" class="accent"/><circle cx="66" cy="42" r="6" fill="#5A6472"/><circle cx="88" cy="42" r="6" fill="#39424E"/>
  <text x="118" y="47" class="mono muted" font-size="13" letter-spacing="1.5">danish.os / fetch</text>
  <circle cx="1058" cy="42" r="4" class="accent live"/>
  <text x="1072" y="46" class="mono muted" font-size="12">tty1</text>
  <line x1="40" y1="68" x2="1160" y2="68" stroke="#2A313C" stroke-width="1"/>

