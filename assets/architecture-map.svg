<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" role="img" aria-labelledby="archTitle archDesc" preserveAspectRatio="xMidYMid meet">
  <title id="archTitle">DANISH.OS architecture map — from interface to infrastructure</title>
  <desc id="archDesc">A layered system diagram with six stacked layers connected by a vertical spine. From top to bottom: Interface (React, Tailwind, ShadCN, Framer Motion), Application (JavaScript, Redux, component systems), API and services (Django, DRF, FastAPI, WebSockets), Data (PostgreSQL, MongoDB, Django ORM), Infrastructure (AWS, Docker, Kubernetes, CI/CD), and Design and systems (Figma, system design, database design). Requests flow down the spine and data flows back up.</desc>

  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", "Cascadia Code", "Fira Code", Menlo, Consolas, monospace; }
      .fg { fill: #E6EDF3; }
      .muted { fill: #8B949E; }
      .dim { fill: #6E7681; }
      .accent { fill: #E9A23B; }
      .chip { fill: #0D1117; stroke: #2A313C; stroke-width: 1; }
      .chiptext { fill: #C9D1D9; }

      .flow { transform-box: fill-box; animation: flow 5s cubic-bezier(.45,0,.55,1) infinite; }
      @keyframes flow {
        0%   { transform: translateY(0);   opacity: 0; }
        10%  { opacity: 1; }
        90%  { opacity: 1; }
        100% { transform: translateY(510px); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .flow { animation: none; opacity: 1; }
      }
    </style>
    <pattern id="archGrid" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#8B949E" opacity="0.08"/>
    </pattern>
    <linearGradient id="archSpine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9A23B" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#E9A23B" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- panel -->
  <rect x="6" y="6" width="1188" height="748" rx="20" fill="#0D1117" stroke="#2A313C" stroke-width="1.5"/>
  <rect x="6" y="6" width="1188" height="748" rx="20" fill="url(#archGrid)"/>

  <!-- header -->
  <text x="40" y="52" class="sans fg" font-size="24" font-weight="700">Architecture Map</text>
  <text x="40" y="76" class="mono muted" font-size="13">interface &#8594; application &#8594; api &#8594; data &#8594; infrastructure</text>
  <text x="1160" y="52" class="mono dim" font-size="12" text-anchor="end">danish.os / topology</text>
  <line x1="40" y1="92" x2="1160" y2="92" stroke="#2A313C" stroke-width="1"/>

  <!-- spine -->
  <line x1="70" y1="142" x2="70" y2="652" stroke="url(#archSpine)" stroke-width="2"/>
  <text x="70" y="118" class="mono dim" font-size="10" text-anchor="middle">req &#8595;</text>
  <text x="70" y="680" class="mono dim" font-size="10" text-anchor="middle">&#8593; data</text>
  <circle cx="70" cy="142" r="6" class="flow"/>

  <!-- ===== Layer rows ===== -->
  <!-- 01 Interface  y=100 -->
  <g>
    <circle cx="70" cy="142" r="4.5" fill="#0D1117" stroke="#E9A23B" stroke-width="2"/>
    <rect x="90" y="100" width="1070" height="84" rx="12" fill="#11161D" stroke="#2A313C" stroke-width="1"/>
    <text x="112" y="138" class="mono accent" font-size="12">01</text>
    <text x="150" y="138" class="sans fg" font-size="17" font-weight="600">Interface</text>
    <text x="150" y="158" class="mono muted" font-size="11">what people see and touch</text>
    <g class="mono" font-size="14">
      <rect class="chip" x="468" y="127" width="66"  height="30" rx="15"/><text class="chiptext" x="501" y="147" text-anchor="middle">React</text>
      <rect class="chip" x="546" y="127" width="91"  height="30" rx="15"/><text class="chiptext" x="591" y="147" text-anchor="middle">Tailwind</text>
      <rect class="chip" x="649" y="127" width="74"  height="30" rx="15"/><text class="chiptext" x="686" y="147" text-anchor="middle">ShadCN</text>
      <rect class="chip" x="735" y="127" width="133" height="30" rx="15"/><text class="chiptext" x="801" y="147" text-anchor="middle">Framer Motion</text>
    </g>
  </g>

  <!-- 02 Application  y=202 -->
  <g>
    <circle cx="70" cy="244" r="4.5" fill="#0D1117" stroke="#E9A23B" stroke-width="2"/>
    <rect x="90" y="202" width="1070" height="84" rx="12" fill="#11161D" stroke="#2A313C" stroke-width="1"/>
    <text x="112" y="240" class="mono accent" font-size="12">02</text>
    <text x="150" y="240" class="sans fg" font-size="17" font-weight="600">Application</text>
    <text x="150" y="260" class="mono muted" font-size="11">client logic and state</text>
    <g class="mono" font-size="14">
      <rect class="chip" x="468" y="229" width="108" height="30" rx="15"/><text class="chiptext" x="522" y="249" text-anchor="middle">JavaScript</text>
      <rect class="chip" x="588" y="229" width="66"  height="30" rx="15"/><text class="chiptext" x="621" y="249" text-anchor="middle">Redux</text>
      <rect class="chip" x="666" y="229" width="167" height="30" rx="15"/><text class="chiptext" x="749" y="249" text-anchor="middle">Component systems</text>
    </g>
  </g>

  <!-- 03 API & Services  y=304 -->
  <g>
    <circle cx="70" cy="346" r="4.5" fill="#0D1117" stroke="#E9A23B" stroke-width="2"/>
    <rect x="90" y="304" width="1070" height="84" rx="12" fill="#11161D" stroke="#2A313C" stroke-width="1"/>
    <text x="112" y="342" class="mono accent" font-size="12">03</text>
    <text x="150" y="342" class="sans fg" font-size="17" font-weight="600">API &amp; Services</text>
    <text x="150" y="362" class="mono muted" font-size="11">contracts between systems</text>
    <g class="mono" font-size="14">
      <rect class="chip" x="468" y="331" width="74"  height="30" rx="15"/><text class="chiptext" x="505" y="351" text-anchor="middle">Django</text>
      <rect class="chip" x="554" y="331" width="49"  height="30" rx="15"/><text class="chiptext" x="578" y="351" text-anchor="middle">DRF</text>
      <rect class="chip" x="615" y="331" width="83"  height="30" rx="15"/><text class="chiptext" x="656" y="351" text-anchor="middle">FastAPI</text>
      <rect class="chip" x="710" y="331" width="108" height="30" rx="15"/><text class="chiptext" x="764" y="351" text-anchor="middle">WebSockets</text>
    </g>
  </g>

  <!-- 04 Data  y=406 -->
  <g>
    <circle cx="70" cy="448" r="4.5" fill="#0D1117" stroke="#E9A23B" stroke-width="2"/>
    <rect x="90" y="406" width="1070" height="84" rx="12" fill="#11161D" stroke="#2A313C" stroke-width="1"/>
    <text x="112" y="444" class="mono accent" font-size="12">04</text>
    <text x="150" y="444" class="sans fg" font-size="17" font-weight="600">Data</text>
    <text x="150" y="464" class="mono muted" font-size="11">persistence and integrity</text>
    <g class="mono" font-size="14">
      <rect class="chip" x="468" y="433" width="108" height="30" rx="15"/><text class="chiptext" x="522" y="453" text-anchor="middle">PostgreSQL</text>
      <rect class="chip" x="588" y="433" width="83"  height="30" rx="15"/><text class="chiptext" x="629" y="453" text-anchor="middle">MongoDB</text>
      <rect class="chip" x="683" y="433" width="108" height="30" rx="15"/><text class="chiptext" x="737" y="453" text-anchor="middle">Django ORM</text>
    </g>
  </g>

  <!-- 05 Infrastructure  y=508 -->
  <g>
    <circle cx="70" cy="550" r="4.5" fill="#0D1117" stroke="#E9A23B" stroke-width="2"/>
    <rect x="90" y="508" width="1070" height="84" rx="12" fill="#11161D" stroke="#2A313C" stroke-width="1"/>
    <text x="112" y="546" class="mono accent" font-size="12">05</text>
    <text x="150" y="546" class="sans fg" font-size="17" font-weight="600">Infrastructure</text>
    <text x="150" y="566" class="mono muted" font-size="11">ship, run, observe</text>
    <g class="mono" font-size="14">
      <rect class="chip" x="468" y="535" width="49"  height="30" rx="15"/><text class="chiptext" x="492" y="555" text-anchor="middle">AWS</text>
      <rect class="chip" x="529" y="535" width="74"  height="30" rx="15"/><text class="chiptext" x="566" y="555" text-anchor="middle">Docker</text>
      <rect class="chip" x="615" y="535" width="108" height="30" rx="15"/><text class="chiptext" x="669" y="555" text-anchor="middle">Kubernetes</text>
      <rect class="chip" x="735" y="535" width="66"  height="30" rx="15"/><text class="chiptext" x="768" y="555" text-anchor="middle">CI/CD</text>
    </g>
  </g>

  <!-- 06 Design & Systems  y=610 -->
  <g>
    <circle cx="70" cy="652" r="4.5" fill="#0D1117" stroke="#E9A23B" stroke-width="2"/>
    <rect x="90" y="610" width="1070" height="84" rx="12" fill="#11161D" stroke="#2A313C" stroke-width="1"/>
    <text x="112" y="648" class="mono accent" font-size="12">06</text>
    <text x="150" y="648" class="sans fg" font-size="17" font-weight="600">Design &amp; Systems</text>
    <text x="150" y="668" class="mono muted" font-size="11">plan before build</text>
    <g class="mono" font-size="14">
      <rect class="chip" x="468" y="637" width="66"  height="30" rx="15"/><text class="chiptext" x="501" y="657" text-anchor="middle">Figma</text>
      <rect class="chip" x="546" y="637" width="133" height="30" rx="15"/><text class="chiptext" x="612" y="657" text-anchor="middle">System design</text>
      <rect class="chip" x="691" y="637" width="100" height="30" rx="15"/><text class="chiptext" x="741" y="657" text-anchor="middle">DB design</text>
    </g>
  </g>

  <!-- footer -->
  <line x1="40" y1="712" x2="1160" y2="712" stroke="#2A313C" stroke-width="1"/>
  <text x="40" y="736" class="mono dim" font-size="11">one request crosses every layer &#8212; that is the job</text>
  <text x="1160" y="736" class="mono dim" font-size="11" text-anchor="end">6 layers &#183; 0 dead ends</text>
</svg>
