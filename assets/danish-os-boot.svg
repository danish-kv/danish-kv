<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" role="img" aria-labelledby="bootTitle bootDesc" preserveAspectRatio="xMidYMid meet">
  <title id="bootTitle">DANISH.OS boot sequence — Muhammed Danish, full-stack systems builder</title>
  <desc id="bootDesc">An operating system boot screen. The DANISH.OS wordmark appears with the name Muhammed Danish, tagline full-stack systems builder, and location India. A boot log initialises the interface, API gateway, data layer and infrastructure, a progress bar fills, and the state SYSTEM READY appears. A signal packet travels a runtime path from interface to API to data to infrastructure, and a cursor blinks at a prompt.</desc>

  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", "Cascadia Code", "Fira Code", Menlo, Consolas, monospace; }
      .fg { fill: #E6EDF3; } .muted { fill: #8B949E; } .dim { fill: #6E7681; } .accent { fill: #E9A23B; }

      @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
      @keyframes fillbar { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes pulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
      @keyframes travel { 0% { transform: translateX(0); opacity: 0; } 6% { opacity: 1; }
                          94% { opacity: 1; } 100% { transform: translateX(880px); opacity: 0; } }

      .r  { transform-box: fill-box; }
      .w1 { animation: rise .5s ease-out .2s both; }
      .w2 { animation: rise .5s ease-out .45s both; }
      .w3 { animation: rise .5s ease-out .65s both; }
      .lg1 { animation: rise .3s ease-out  .9s both; }
      .lg2 { animation: rise .3s ease-out 1.5s both; }
      .lg3 { animation: rise .3s ease-out 2.1s both; }
      .lg4 { animation: rise .3s ease-out 2.7s both; }
      .rdy { animation: rise .45s ease-out 3.5s both; }
      .bar { transform-box: fill-box; transform-origin: left center; animation: fillbar 2.6s ease-in-out .8s both; }
      .met { animation: fadein .6s ease-out 3.2s both; }
      .pth { animation: fadein .6s ease-out 3.4s both; }
      .cursor { animation: fadein .3s ease-out 3.7s both, blink 1.1s step-end 4s infinite; }
      .live { animation: pulse 2.6s ease-in-out infinite; }
      .pk { transform-box: fill-box; animation: travel 5.2s cubic-bezier(.45,0,.55,1) 4s infinite; }

      @media (prefers-reduced-motion: reduce) {
        .w1,.w2,.w3,.lg1,.lg2,.lg3,.lg4,.rdy,.bar,.met,.pth,.cursor,.live,.pk { animation: none; }
      }
    </style>
    <radialGradient id="bGlow" cx="24%" cy="30%" r="60%">
      <stop offset="0" stop-color="#E9A23B" stop-opacity="0.15"/><stop offset="1" stop-color="#E9A23B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bSpine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E9A23B" stop-opacity=".15"/><stop offset=".5" stop-color="#E9A23B" stop-opacity=".55"/><stop offset="1" stop-color="#E9A23B" stop-opacity=".15"/>
    </linearGradient>
    <pattern id="bGrid" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#8B949E" opacity="0.09"/>
    </pattern>
  </defs>

  <!-- panel -->
  <rect x="6" y="6" width="1188" height="508" rx="20" fill="#0D1117" stroke="#2A313C" stroke-width="1.5"/>
  <rect x="6" y="6" width="1188" height="508" rx="20" fill="url(#bGrid)"/>
  <rect x="6" y="6" width="1188" height="508" rx="20" fill="url(#bGlow)"/>

  <!-- title bar -->
  <circle cx="44" cy="42" r="6" class="accent"/><circle cx="66" cy="42" r="6" fill="#5A6472"/><circle cx="88" cy="42" r="6" fill="#39424E"/>
  <text x="118" y="47" class="mono muted" font-size="13" letter-spacing="1.5">danish.os / boot</text>
  <circle cx="1024" cy="42" r="4" class="accent live"/>
  <text x="1038" y="46" class="mono muted" font-size="12">online &#183; v1.1.0</text>
  <line x1="40" y1="68" x2="1160" y2="68" stroke="#2A313C" stroke-width="1"/>

  <!-- identity -->
  <g class="r w1">
    <text x="52" y="188" class="sans" font-size="72" font-weight="800" letter-spacing="-1"><tspan class="fg">DANISH</tspan><tspan class="accent">.OS</tspan></text>
    <rect x="56" y="206" width="220" height="4" rx="2" class="accent"/>
  </g>
  <g class="r w2">
    <text x="56" y="246" class="sans fg" font-size="22" font-weight="600">Muhammed Danish</text>
    <text x="56" y="274" class="sans muted" font-size="16">Full-stack systems builder &#183; India</text>
  </g>
  <g class="r w3">
    <text x="56" y="316" class="mono dim" font-size="13"><tspan class="accent">&#10095;</tspan> designing the path from interface to infrastructure</text>
  </g>

  <!-- boot progress -->
  <g class="mono" font-size="12">
    <text x="56" y="356" class="dim">boot</text>
    <rect x="100" y="348" width="300" height="8" rx="4" fill="#21262D"/>
    <rect x="100" y="348" width="300" height="8" rx="4" class="accent bar"/>
    <text x="414" y="356" class="dim">sys</text>
  </g>
  <g class="r met mono" font-size="13">
    <text x="56" y="392" class="muted">runtime<tspan class="dim"> = </tspan><tspan class="fg">full_stack</tspan><tspan class="dim">&#160;&#160;&#183;&#160;&#160;</tspan>mode<tspan class="dim"> = </tspan><tspan class="fg">curious</tspan><tspan class="dim">&#160;&#160;&#183;&#160;&#160;</tspan>state<tspan class="dim"> = </tspan><tspan class="accent">building</tspan></text>
  </g>

  <!-- boot log -->
  <rect x="742" y="96" width="406" height="238" rx="14" fill="#11161D" stroke="#2A313C" stroke-width="1"/>
  <text x="766" y="128" class="mono accent" font-size="12" letter-spacing="1">boot.log</text>
  <line x1="766" y1="142" x2="1124" y2="142" stroke="#21262D" stroke-width="1"/>
  <g class="mono" font-size="13">
    <text x="766" y="172" class="r lg1"><tspan class="accent">[ok]</tspan><tspan class="muted" x="812"> interface ..........</tspan><tspan class="fg" x="1030">online</tspan></text>
    <text x="766" y="200" class="r lg2"><tspan class="accent">[ok]</tspan><tspan class="muted" x="812"> api gateway ........</tspan><tspan class="fg" x="1030">online</tspan></text>
    <text x="766" y="228" class="r lg3"><tspan class="accent">[ok]</tspan><tspan class="muted" x="812"> data layer .........</tspan><tspan class="fg" x="1030">linked</tspan></text>
    <text x="766" y="256" class="r lg4"><tspan class="accent">[ok]</tspan><tspan class="muted" x="812"> infrastructure .....</tspan><tspan class="fg" x="1030">ready</tspan></text>
  </g>
  <g class="r rdy">
    <text x="766" y="300" class="mono accent" font-size="15" letter-spacing="2">&#10003; SYSTEM READY</text>
    <circle cx="960" cy="295" r="4" class="accent live"/>
  </g>
  <rect x="766" y="312" width="9" height="14" class="accent cursor"/>

  <!-- runtime path -->
  <g class="r pth">
    <text x="52" y="428" class="mono dim" font-size="11" letter-spacing="1">runtime.path</text>
    <line x1="160" y1="452" x2="1040" y2="452" stroke="url(#bSpine)" stroke-width="2"/>
    <g>
      <circle cx="160"  cy="452" r="7" fill="#0D1117" stroke="#E9A23B" stroke-width="2"/><circle cx="160"  cy="452" r="2.5" class="accent"/>
      <circle cx="453"  cy="452" r="7" fill="#0D1117" stroke="#E9A23B" stroke-width="2"/><circle cx="453"  cy="452" r="2.5" class="accent"/>
      <circle cx="746"  cy="452" r="7" fill="#0D1117" stroke="#E9A23B" stroke-width="2"/><circle cx="746"  cy="452" r="2.5" class="accent"/>
      <circle cx="1040" cy="452" r="7" fill="#0D1117" stroke="#E9A23B" stroke-width="2"/><circle cx="1040" cy="452" r="2.5" class="accent"/>
    </g>
    <circle cx="160" cy="452" r="5" class="accent pk"/>
    <g class="mono muted" font-size="12" text-anchor="middle">
      <text x="160"  y="482">interface</text>
      <text x="453"  y="482">api</text>
      <text x="746"  y="482">data</text>
      <text x="1040" y="482">infrastructure</text>
    </g>
  </g>
</svg>
