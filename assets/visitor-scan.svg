<?xml version="1.0" encoding="UTF-8"?>
<!-- Decorative panel. It "scans" nothing and collects nothing — pure visual storytelling. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="100%" role="img" aria-labelledby="scanTitle scanDesc" preserveAspectRatio="xMidYMid meet">
  <title id="scanTitle">Visitor session panel — decorative</title>
  <desc id="scanDesc">A playful status strip. Lines read visitor session detected, profile environment loaded, architecture access granted. A soft scanning beam sweeps across. A note clarifies it is decorative and collects no data.</desc>

  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", "Cascadia Code", "Fira Code", Menlo, Consolas, monospace; }
      .fg { fill: #E6EDF3; } .muted { fill: #8B949E; } .dim { fill: #6E7681; } .accent { fill: #E9A23B; }
      @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes sweep { from { transform: translateX(-180px); } to { transform: translateX(1240px); } }
      @keyframes pulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
      .r { transform-box: fill-box; }
      .s1 { animation: rise .35s ease-out .3s both; }
      .s2 { animation: rise .35s ease-out 1.1s both; }
      .s3 { animation: rise .35s ease-out 1.9s both; }
      .beam { animation: sweep 6s linear 1s infinite both; }
      .live { animation: pulse 2.4s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .s1,.s2,.s3,.beam,.live { animation: none; } .beam { opacity: 0; } }
    </style>
    <linearGradient id="scanBeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E9A23B" stop-opacity="0"/><stop offset=".5" stop-color="#E9A23B" stop-opacity=".1"/><stop offset="1" stop-color="#E9A23B" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <clipPath id="scanClip"><rect x="6" y="6" width="1188" height="158" rx="16"/></clipPath>

  <rect x="6" y="6" width="1188" height="158" rx="16" fill="#0D1117" stroke="#2A313C" stroke-width="1.5"/>
  <g clip-path="url(#scanClip)"><rect x="0" y="6" width="160" height="158" fill="url(#scanBeam)" class="beam"/></g>

  <text x="36" y="40" class="mono accent" font-size="12" letter-spacing="1.5">visitor.scan</text>
  <line x1="36" y1="54" x2="380" y2="54" stroke="#2A313C" stroke-width="1"/>

  <g class="mono" font-size="14">
    <text x="36" y="86"  class="r s1"><tspan class="accent">&#10003;</tspan><tspan class="fg" x="58"> VISITOR SESSION DETECTED</tspan></text>
    <text x="36" y="114" class="r s2"><tspan class="accent">&#10003;</tspan><tspan class="fg" x="58"> PROFILE ENVIRONMENT LOADED</tspan></text>
    <text x="36" y="142" class="r s3"><tspan class="accent">&#10003;</tspan><tspan class="fg" x="58"> ARCHITECTURE ACCESS GRANTED</tspan></text>
  </g>

  <g class="mono" font-size="13" text-anchor="end">
    <circle cx="842" cy="82" r="4" class="accent live"/>
    <text x="1160" y="86" class="muted">session = <tspan class="fg">guest</tspan> &#183; access = <tspan class="fg">read-only</tspan></text>
    <text x="1160" y="114" class="dim" font-size="12">clearance: everything here is public anyway</text>
    <text x="1160" y="140" class="dim" font-size="11">decorative panel &#183; no data is collected</text>
  </g>
</svg>
