<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="100%" role="img" aria-labelledby="flowTitle flowDesc" preserveAspectRatio="xMidYMid meet">
  <title id="flowTitle">DANISH.OS architecture flow — a request's full path</title>
  <desc id="flowDesc">A system diagram. A request packet travels from User through React interface, state layer, API gateway, Django and FastAPI services, to PostgreSQL and MongoDB data, and a response returns along the same path. Each node pulses as the packet passes. Below, a runtime platform bar shows Docker, Kubernetes and AWS with status lights.</desc>

  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", "Cascadia Code", "Fira Code", Menlo, Consolas, monospace; }
      .fg { fill: #E6EDF3; } .muted { fill: #8B949E; } .dim { fill: #6E7681; } .accent { fill: #E9A23B; }

      @keyframes req { 0% { transform: translateX(0); opacity: 0; } 2% { opacity: 1; }
                       40% { transform: translateX(930px); opacity: 1; } 44% { opacity: 0; }
                       100% { transform: translateX(930px); opacity: 0; } }
      @keyframes res { 0%, 50% { transform: translateX(930px); opacity: 0; } 52% { opacity: 1; }
                       88% { transform: translateX(0); opacity: 1; } 92%, 100% { transform: translateX(0); opacity: 0; } }
      @keyframes flash { 0% { opacity: 0; } 2% { opacity: 1; } 9% { opacity: 0; } 100% { opacity: 0; } }
      @keyframes pulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
      @keyframes drawin { from { stroke-dashoffset: 930; } to { stroke-dashoffset: 0; } }
      @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

      .wire { stroke-dasharray: 930; animation: drawin 1.1s ease-out .2s both; }
      .drop { animation: fadein .6s ease-out 1.2s both; }
      .reqdot { transform-box: fill-box; animation: req 7.5s cubic-bezier(.45,0,.55,1) 1.4s infinite; opacity: 0; }
      .resdot { transform-box: fill-box; animation: res 7.5s cubic-bezier(.45,0,.55,1) 1.4s infinite; opacity: 0; }
      .hl { opacity: 0; animation: flash 7.5s linear infinite; }
      .h0 { animation-delay: 1.55s; } .h1 { animation-delay: 2.12s; } .h2 { animation-delay: 2.69s; }
      .h3 { animation-delay: 3.26s; } .h4 { animation-delay: 3.83s; } .h5 { animation-delay: 4.4s; }
      .live { animation: pulse 2.8s ease-in-out infinite; }
      .l2 { animation-delay: .7s; } .l3 { animation-delay: 1.4s; }

      @media (prefers-reduced-motion: reduce) {
        .wire, .drop, .reqdot, .resdot, .hl, .live, .l2, .l3 { animation: none; }
        .reqdot, .resdot, .hl { opacity: 0; }
      }
    </style>
    <pattern id="fGrid" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#8B949E" opacity="0.08"/>
    </pattern>
  </defs>

  <rect x="6" y="6" width="1188" height="458" rx="20" fill="#0D1117" stroke="#2A313C" stroke-width="1.5"/>
  <rect x="6" y="6" width="1188" height="458" rx="20" fill="url(#fGrid)"/>

  <!-- header -->
  <text x="40" y="48" class="sans fg" font-size="21" font-weight="700">Architecture Flow</text>
  <text x="40" y="72" class="mono muted" font-size="12">one request &#183; every layer &#183; and back</text>
  <g class="mono dim" font-size="11" text-anchor="end">
    <circle cx="978" cy="43" r="4" class="accent"/><text x="1030" y="47">request</text>
    <circle cx="1052" cy="43" r="4" fill="#8B949E"/><text x="1108" y="47">response</text>
  </g>

  <!-- wire + packets (packets behind boxes so they slip beneath each node) -->
  <line x1="135" y1="146" x2="1065" y2="146" stroke="#2A313C" stroke-width="2" class="wire"/>
  <circle cx="135" cy="146" r="5" class="accent reqdot"/>
  <circle cx="135" cy="146" r="5" fill="#8B949E" class="resdot"/>

  <!-- nodes -->
  <g>
    <rect x="50"  y="114" width="170" height="64" rx="12" fill="#11161D" stroke="#2A313C"/>
    <rect x="50"  y="114" width="170" height="64" rx="12" fill="none" stroke="#E9A23B" stroke-width="1.5" class="hl h0"/>
    <text x="135" y="141" class="sans fg" font-size="15" font-weight="600" text-anchor="middle">User</text>
    <text x="135" y="161" class="mono muted" font-size="11" text-anchor="middle">human &#183; browser</text>

    <rect x="236" y="114" width="170" height="64" rx="12" fill="#11161D" stroke="#2A313C"/>
    <rect x="236" y="114" width="170" height="64" rx="12" fill="none" stroke="#E9A23B" stroke-width="1.5" class="hl h1"/>
    <text x="321" y="141" class="sans fg" font-size="15" font-weight="600" text-anchor="middle">Interface</text>
    <text x="321" y="161" class="mono muted" font-size="11" text-anchor="middle">react &#183; tailwind</text>

    <rect x="422" y="114" width="170" height="64" rx="12" fill="#11161D" stroke="#2A313C"/>
    <rect x="422" y="114" width="170" height="64" rx="12" fill="none" stroke="#E9A23B" stroke-width="1.5" class="hl h2"/>
    <text x="507" y="141" class="sans fg" font-size="15" font-weight="600" text-anchor="middle">State</text>
    <text x="507" y="161" class="mono muted" font-size="11" text-anchor="middle">redux &#183; client logic</text>

    <rect x="608" y="114" width="170" height="64" rx="12" fill="#11161D" stroke="#2A313C"/>
    <rect x="608" y="114" width="170" height="64" rx="12" fill="none" stroke="#E9A23B" stroke-width="1.5" class="hl h3"/>
    <text x="693" y="141" class="sans fg" font-size="15" font-weight="600" text-anchor="middle">API Gateway</text>
    <text x="693" y="161" class="mono muted" font-size="11" text-anchor="middle">rest &#183; websockets</text>

    <rect x="794" y="114" width="170" height="64" rx="12" fill="#11161D" stroke="#2A313C"/>
    <rect x="794" y="114" width="170" height="64" rx="12" fill="none" stroke="#E9A23B" stroke-width="1.5" class="hl h4"/>
    <text x="879" y="141" class="sans fg" font-size="15" font-weight="600" text-anchor="middle">Services</text>
    <text x="879" y="161" class="mono muted" font-size="11" text-anchor="middle">django &#183; fastapi</text>

    <rect x="980" y="114" width="170" height="64" rx="12" fill="#11161D" stroke="#2A313C"/>
    <rect x="980" y="114" width="170" height="64" rx="12" fill="none" stroke="#E9A23B" stroke-width="1.5" class="hl h5"/>
    <text x="1065" y="141" class="sans fg" font-size="15" font-weight="600" text-anchor="middle">Data</text>
    <text x="1065" y="161" class="mono muted" font-size="11" text-anchor="middle">postgres &#183; mongo</text>
  </g>

  <!-- drops to platform -->
  <g stroke="#2A313C" stroke-width="1.5" stroke-dasharray="3 5" class="drop">
    <line x1="693"  y1="178" x2="693"  y2="300"/>
    <line x1="879"  y1="178" x2="879"  y2="300"/>
    <line x1="1065" y1="178" x2="1065" y2="300"/>
  </g>
  <text x="560" y="250" class="mono dim drop" font-size="11" text-anchor="end">everything below the interface runs on &#8594;</text>

  <!-- platform bar -->
  <rect x="50" y="300" width="1100" height="96" rx="14" fill="#11161D" stroke="#2A313C"/>
  <text x="82" y="338" class="mono accent" font-size="12" letter-spacing="1">runtime.platform</text>
  <text x="82" y="360" class="mono dim" font-size="11">ship &#183; run &#183; observe</text>
  <g class="mono fg" font-size="14">
    <rect x="420" y="330" width="150" height="36" rx="18" fill="#0D1117" stroke="#2A313C"/>
    <circle cx="448" cy="348" r="4" class="accent live"/><text x="464" y="353">Docker</text>
    <rect x="600" y="330" width="180" height="36" rx="18" fill="#0D1117" stroke="#2A313C"/>
    <circle cx="628" cy="348" r="4" class="accent live l2"/><text x="644" y="353">Kubernetes</text>
    <rect x="810" y="330" width="120" height="36" rx="18" fill="#0D1117" stroke="#2A313C"/>
    <circle cx="838" cy="348" r="4" class="accent live l3"/><text x="854" y="353">AWS</text>
  </g>
  <text x="1118" y="353" class="mono dim" font-size="11" text-anchor="end">all lights on</text>

  <text x="40" y="440" class="mono dim" font-size="11">a screen is the surface &#8212; this is the system underneath it</text>
  <text x="1160" y="440" class="mono dim" font-size="11" text-anchor="end">round trip &#183; ~7.5s scale time</text>
</svg>
